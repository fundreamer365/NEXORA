<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — NEXORA</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-text">NEXORA</div>
      </div>
      <div class="auth-tagline">Create your account</div>

      <form id="register-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input id="reg-username" name="username" type="text" required
                 minlength="3" maxlength="24" autocomplete="username" autofocus>
          <div class="form-hint">3–24 chars: letters, digits, underscore</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" required
                 minlength="8" autocomplete="new-password">
          <div class="form-hint">At least 8 characters</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password2">Confirm password</label>
          <input id="reg-password2" name="password2" type="password" required
                 minlength="8" autocomplete="new-password">
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button type="submit" class="btn btn-primary auth-submit">Create account</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
